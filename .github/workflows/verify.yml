name: Verify app and capture screenshots

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up frontend build tools
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Check source formatting
        run: npm run format:check

      - name: Test API and persistence
        run: python -m pytest -q

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check browser workflow and capture screenshots
        run: npm run screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zeelinks-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
